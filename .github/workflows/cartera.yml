name: Mi cartera

# Corre apenas alguien sincroniza su cartera desde cartera.html (push a carteras/).
# El motor horario ("Motor de señales") la vuelve a analizar en cada corrida.
on:
  push:
    branches: [main]
    paths: ["carteras/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motor-senales
  cancel-in-progress: false

jobs:
  cartera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Dependencias
        run: pip install -r engine/requirements.txt
      - name: Analizar carteras
        # Los logs son públicos: el script solo imprime cantidades, nunca activos ni montos
        env:
          CARTERA_PRIVADA: ${{ secrets.CARTERA_PRIVADA }}
          IOL_USUARIO: ${{ secrets.IOL_USUARIO }}
          IOL_CLAVE: ${{ secrets.IOL_CLAVE }}
          CARTERA_CLAVE: ${{ secrets.CARTERA_CLAVE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.cartera
      - name: Publicar
        run: |
          git config user.name "traderpanel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Mi cartera $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
