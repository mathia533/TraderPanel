name: Motor de señales

on:
  schedule:
    # Días hábiles, cada hora mientras operan NYSE (9:30-16 NY) y BYMA (11-17 AR), más una corrida al cierre
    - cron: "35 13-22 * * 1-5"
    # Cripto opera siempre: fines de semana cada 4 horas
    - cron: "10 */4 * * 0,6"
    # Intradía (day-trader-skill): ruptura del rango de apertura en ADRs, stop/objetivo y cierre 15:55 NY.
    # Junto con la corrida horaria (minuto 35) queda una revisión cada 15 minutos en la rueda de NY.
    - cron: "5,20,50 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      sin_regimen_cripto:
        description: "Saltear el régimen cripto (más rápido)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: motor-senales
  cancel-in-progress: false

jobs:
  senales:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Modo de la corrida
        id: modo
        run: |
          if [ "${{ github.event.schedule }}" = "5,20,50 13-20 * * 1-5" ]; then echo "intradia=true" >> "$GITHUB_OUTPUT"; else echo "intradia=false" >> "$GITHUB_OUTPUT"; fi
      - name: Dependencias
        run: pip install -r engine/requirements.txt
      - name: pdftotext (operaciones de congresistas, trader-pelosi)
        if: steps.modo.outputs.intradia != 'true'
        continue-on-error: true
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Pruebas
        if: steps.modo.outputs.intradia != 'true'
        run: python -m pytest -q tests
      - name: Correr el motor
        env:
          # Opcional: "Tu Nombre tu@mail.com". La SEC lo pide para balances y hechos relevantes (8-K/6-K).
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "${{ steps.modo.outputs.intradia }}" = "true" ]; then python -m engine.run --intradia
          elif [ "${{ inputs.sin_regimen_cripto }}" = "true" ]; then python -m engine.run --no-crypto-regime
          else python -m engine.run; fi
      - name: Índices bursátiles
        if: steps.modo.outputs.intradia != 'true'
        # Independiente del motor: si Yahoo falla, el panel conserva el dato anterior
        continue-on-error: true
        run: python -m engine.indices
      - name: Ranking de sectores
        if: steps.modo.outputs.intradia != 'true'
        # Registro diario por sector (BYMA, data912). Si falla, queda el archivo anterior
        continue-on-error: true
        run: python -m engine.sectors
      - name: Mi cartera (InvertirOnline)
        if: steps.modo.outputs.intradia != 'true'
        # Solo lectura de la cuenta. Sin los secrets se saltea. Publica data/cartera.enc cifrado
        # (el repo es público); los logs no muestran activos ni montos.
        continue-on-error: true
        # Una cartera por usuario de users/users.json: IOL_USUARIO_<LOGIN>, IOL_CLAVE_<LOGIN> y
        # CARTERA_CLAVE_<LOGIN> (login en mayúsculas, "-" pasa a "_"). El dueño puede usar los nombres sin sufijo.
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python -m engine.cartera
      - name: Publicar señales
        run: |
          git config user.name "traderpanel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          if [ "${{ steps.modo.outputs.intradia }}" = "true" ]; then MSG="Intradía"; else MSG="Señales"; fi
          git commit -m "$MSG $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
